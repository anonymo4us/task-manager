spring:
  flyway:
    validate-migration-naming: true
  application:
    name: task-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/task_manager
    username: task_manager
    password: task_manager
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate         # ??? dev; ? prod ? validate ??? none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace   # ?????????? ???????? ?????????? ? SQL