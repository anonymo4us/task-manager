spring:
    application:
      name: task-manager

    flyway:
      validate-migration-naming: true

    datasource:
      url: jdbc:postgresql://127.0.0.1:5433/task_manager
      username: task_manager
      password: task_manager
      driver-class-name: org.postgresql.Driver

    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          format_sql: true

server:
    port: 8080

logging:
    level:
      org.hibernate.SQL: debug
      org.hibernate.orm.jdbc.bind: trace